  #   # Dùng host network để lấy IP thật
  #   network_mode: "host"
  #
  #   environment:
  #     - CONFIG_FILE=/app/config_board.yaml
  #
  #   mem_limit: 50m
  #
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "2m"
  #       max-file: "1"
  #
  #   tty: true
  #   stdin_open: true


  # =========================
  # MJPG Streamer (Camera)
  # =========================
  # mjpg-streamer:
  #   image: patsoffice/mjpg-streamer
  #   container_name: mjpg-streamer
  #   restart: unless-stopped
  #
  #   # USB camera
  #   devices:
  #     - /dev/video0:/dev/video0
  #
  #   ports:
  #     - "8081:8080"
