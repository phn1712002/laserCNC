services:
  laserweb:
    image: mkuf/laserweb:latest
    container_name: laserweb
    restart: unless-stopped
    privileged: true
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./config:/config
      - ./gcode:/gcode
      - /dev:/dev
    ports:
      - "8080:80"  
    networks:
      - web
      - tailscale

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laserweb
    networks:
      - web
      - tailscale

  lcd-display:
    build: ./IPLaserCNC
    container_name: lcd-hostname-ip
    restart: unless-stopped
    privileged: true

    # I2C
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
  
    # Use host network to get host's IP address
    network_mode: "host"
    
    # Environment variables
    environment:
      - CONFIG_FILE=/app/config_board.yaml
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.gethostname()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Keep container running
    tty: true
    stdin_open: true

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    privileged: true
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=laser-cnc-${HOSTNAME:-docker}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-exit-node
      - TS_USERSPACE=false
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      - tailscale
    command: tailscaled

  # mjpg-streamer:
  #   restart: always
  #   image: patsoffice/mjpg-streamer
  #   devices:
  #     - /dev/video0
  #   ports:
  #     - 8081:8080
  #   environment:
  #     - MJPEG_STREAMER_INPUT="-y -n -r 640x480 -f 15 -r 90"
  #   networks:
  #     - web
  #     - tailscale


networks:
  web:
    driver: bridge
  tailscale:
    driver: bridge