services:
  laserweb:
    image: mkuf/laserweb:latest
    container_name: laserweb
    restart: unless-stopped
    privileged: true
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./config:/config
      - ./gcode:/gcode
      - /dev:/dev
    ports:
      - "80:80"
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"
    networks:
      - web

  lw-comm-server:
    build: ./lw.comm-server
    container_name: lw-comm-server
    privileged: true
    restart: unless-stopped
    ports:
      - "8081:8000"
    volumes:
      - /dev:/dev
    environment:
      - TZ=Asia/Ho_Chi_Minh
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"
    networks:
      - web

