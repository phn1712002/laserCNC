services:
  laserweb:
    image: mkuf/laserweb:latest
    container_name: laserweb
    restart: unless-stopped
    privileged: true
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./config:/config
      - ./gcode:/gcode
      - /dev:/dev
    ports:
      - "8080:80"  
    networks:
      - web

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laserweb
    networks:
      - web
      
