# Board configuration file for IPLaserCNC project
# This file is used to configure parameters for different board types
# Edit this file according to the board you are using, then run the script with the appropriate configuration

# ============================================================================
# USAGE INSTRUCTIONS:
# 1. Select the board you are using (Pi3B, Pi3B+, Orange Pi Zero 3, etc.)
# 2. Copy the entire section of that board (from "pi3b_config:" to the end of the section)
# 3. Paste it into the "active_configuration" section at the end of this file (replace existing content)
# 4. Modify parameters if needed (I2C address, backlight, etc.)
# 5. Save the file and run the script with:
#    python display_hostname_ip.py --config config_board.yaml
# ============================================================================

# ----------------------------------------------------------------------------
# CONFIGURATION FOR RASPBERRY PI 3 MODEL B (Pi3B)
# ----------------------------------------------------------------------------
pi3b_config:
  # Board name
  board_name: "Raspberry Pi 3 Model B"
  
  # I2C information
  i2c:
    # I2C address of the LCD (commonly 0x3F or 0x27)
    # Use the command `sudo i2cdetect -y 1` to detect the address
    address: 0x3F
    
    # I2C bus (1 for Raspberry Pi 2/3/4)
    bus: 1
    
    # I2C device path
    device: "/dev/i2c-1"
  
  # LCD information
  lcd:
    # Enable/disable LCD backlight
    backlight: true
    
    # Number of LCD lines (usually 2)
    lines: 2
    
    # Characters per line (usually 16)
    chars_per_line: 16
  
  # Raspberry Pi information
  raspberry_pi:
    # Pi revision (2 for Pi 2/3/4)
    revision: 2
    
    # Specific model
    model: "Pi 3 Model B"
  
  # General settings
  settings:
    # IP update interval (seconds)
    update_interval: 60
    
    # Show hostname on line 1
    show_hostname: true
    
    # Show IP on line 2
    show_ip: true
    
    # Automatically refresh IP when it changes
    auto_refresh_ip: true

