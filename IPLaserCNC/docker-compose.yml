services:
  lcd-display:
    build: .
    container_name: lcd-hostname-ip
    restart: unless-stopped
    devices:
      # Map I2C device (adjust based on your Raspberry Pi version)
      - "/dev/i2c-1:/dev/i2c-1"
    # For Raspberry Pi 1, use /dev/i2c-0 instead:
    # - "/dev/i2c-0:/dev/i2c-0"
    
    # Optional: Use host network to get host's IP address
    # network_mode: "host"
    
    # Optional: Mount host's network info to get host IP
    # volumes:
    #   - /proc/net:/proc/net:ro
    
    # Environment variables
    environment:
      - LCD_I2C_ADDR=0x3F
      - LCD_PI_REV=2
      - LCD_BACKLIGHT=true
      - UPDATE_INTERVAL=60
    
    # Run as privileged if needed for GPIO access
    # privileged: true
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.gethostname()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Keep container running
    tty: true
    stdin_open: true