services:
  lcd-display:
    build: .
    container_name: lcd-hostname-ip
    restart: unless-stopped
    
    # Map I2C device (adjust based on your board version)
    # For Raspberry Pi 2/3/4 and Orange Pi Zero 3 (usually):
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
    # For Raspberry Pi 1:
    # devices:
    #   - "/dev/i2c-0:/dev/i2c-0"
    
    # Optional: Mount config file for board-specific configuration
    volumes:
      # Mount custom YAML config file (optional, overrides built-in config)
      # - ./my_custom_config.yaml:/app/config_board.yaml:ro
      # Mount host's network info to get host IP
      - /proc/net:/proc/net:ro
    
    # Optional: Use host network to get host's IP address
    # network_mode: "host"
    
    # Environment variables (can be overridden by config file)
    environment:
      # Basic LCD settings
      - LCD_I2C_ADDR=0x3F
      - LCD_PI_REV=2
      - LCD_BACKLIGHT=true
      - UPDATE_INTERVAL=60
      
      # Board type (optional, for auto-configuration)
      # Available options: raspberry_pi_3b, raspberry_pi_3b_plus, orange_pi_zero_3
      # - BOARD_TYPE=raspberry_pi_3b_plus
      
      # Config file mode (if set, uses YAML config instead of env vars)
      # - CONFIG_FILE=/app/config_board.yaml
    
    # Run as privileged if needed for GPIO access
    # privileged: true
    
    # Command to run (can use config file or environment variables)
    # Default: uses environment variables
    # To use built-in config file:
    # command: ["python", "display_hostname_ip.py", "--config", "/app/config_board.yaml"]
    # To use custom config file (mounted from host):
    # command: ["python", "display_hostname_ip.py", "--config", "/app/config_board.yaml"]
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.gethostname()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Keep container running
    tty: true
    stdin_open: true
